name: CI

on:
  push:
    branches-ignore:
      - main # main is checked by the Build workflow, which runs this one first
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prepare a virtual display
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          # Ubuntu 24.04 blocks the user namespaces Electron's sandbox needs.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Smoke tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm test
      - name: Smoke tests (Windows)
        if: runner.os == 'Windows'
        run: npm test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-report-${{ matrix.os }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
