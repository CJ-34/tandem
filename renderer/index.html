<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>Tandem</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="titlebar">
    <div class="brand">
      <svg viewBox="0 0 20 20" aria-hidden="true">
        <rect x="2" y="3.5" width="7" height="13" rx="2" class="mark-a"/>
        <rect x="11.5" y="4" width="6" height="12" rx="1.6" class="mark-b"/>
      </svg>
      <span>Tandem</span>
    </div>
    <div class="title-actions">
      <button id="btn-find" class="tb-btn" title="Find files (Alt+F7)">
        <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.5" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="m10.4 10.4 3.6 3.6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      </button>
      <button id="btn-qv" class="tb-btn" title="Quick view in the other pane (Ctrl+Q)" aria-pressed="false">
        <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1.75" y="2.75" width="12.5" height="10.5" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M8 2.75v10.5" stroke="currentColor" stroke-width="1.2"/><path d="M10 6h2.5M10 8h2.5M10 10h1.5" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/></svg>
      </button>
      <button id="btn-hidden" class="tb-btn" title="Show hidden files (Ctrl+H)" aria-pressed="false">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 8s2.3-4.5 6.5-4.5S14.5 8 14.5 8 12.2 12.5 8 12.5 1.5 8 1.5 8z" fill="none" stroke="currentColor" stroke-width="1.2"/><circle cx="8" cy="8" r="2" fill="currentColor"/></svg>
      </button>
      <button id="btn-theme" class="tb-btn" title="Switch between light and dark">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.75a6.25 6.25 0 1 0 0 12.5z" fill="currentColor"/><circle cx="8" cy="8" r="6.25" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>
      </button>
    </div>
  </header>

  <main class="workspace" id="workspace">
    <section class="pane" data-pane="0" aria-label="Left pane"></section>
    <div class="splitter" id="splitter" role="separator" aria-orientation="vertical" title="Drag to resize, double-click to reset"></div>
    <section class="pane" data-pane="1" aria-label="Right pane"></section>
  </main>

  <footer class="actionbar">
    <button data-act="rename"><kbd>F2</kbd>Rename</button>
    <button data-act="view"><kbd>F3</kbd>View</button>
    <button data-act="open" data-sact="newfile"><kbd>F4</kbd><span class="l">Open</span><span class="ls">New file</span></button>
    <button data-act="copy" data-sact="copyas"><kbd>F5</kbd><span class="l">Copy</span><span class="ls">Copy here</span></button>
    <button data-act="move" data-sact="rename"><kbd>F6</kbd><span class="l">Move</span><span class="ls">Rename</span></button>
    <button data-act="mkdir"><kbd>F7</kbd>New folder</button>
    <button data-act="delete" class="danger"><kbd>F8</kbd>Delete</button>
  </footer>

  <div id="toasts" class="toasts" aria-live="polite"></div>
  <div id="modal-root"></div>
  <div id="menu" class="menu" role="menu" hidden></div>

  <template id="pane-tpl">
    <div class="tabs">
      <div class="tablist" role="tablist"></div>
      <button class="tab-add" title="New tab (Ctrl+T)" aria-label="New tab">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3.5v9M3.5 8h9" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="locbar">
      <select class="drive" title="Drive (Alt+F1 / Alt+F2)" aria-label="Drive"></select>
      <button class="icon-btn up" title="Parent folder (Backspace)" aria-label="Parent folder">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 13V3.5M3.75 7.5 8 3.25l4.25 4.25" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="icon-btn star" title="Favorite folders (Ctrl+D)" aria-label="Favorite folders">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="m8 2.2 1.75 3.6 3.95.55-2.87 2.77.7 3.93L8 11.2l-3.53 1.85.7-3.93L2.3 6.35l3.95-.55z" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg>
      </button>
      <div class="crumbs" title="Double-click empty space or press Ctrl+L to type a path"></div>
      <input class="pathinput" spellcheck="false" aria-label="Folder path" hidden>
      <label class="filter" title="Start typing to filter (Esc clears)">
        <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.25" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="m10.25 10.25 3.25 3.25" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
        <input class="filter-input" placeholder="Filter" spellcheck="false" aria-label="Filter files">
      </label>
    </div>
    <div class="head">
      <button data-sort="name">Name</button>
      <button data-sort="kind">Kind</button>
      <button data-sort="size" class="num">Size</button>
      <button data-sort="mtime">Modified</button>
    </div>
    <div class="list" tabindex="0" role="listbox" aria-multiselectable="true"></div>
    <div class="status"><span class="count"></span><span class="free"></span></div>
    <div class="quickview" hidden>
      <header class="qv-head"><span class="qv-title"></span><span class="qv-meta"></span></header>
      <div class="qv-body"></div>
    </div>
  </template>

  <script src="app.js"></script>
</body>
</html>
